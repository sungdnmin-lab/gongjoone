<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">모의고사 1 제6번 정압법 덕트 배치도 간소화안</title>
  <desc id="desc">공기흡입구, 송풍기, H-A-B-C 주덕트와 D부터 G까지의 상하부 취출구 및 각 구간 길이를 중복 없이 표시한 흑백 도면</desc>
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111"/>
    </marker>
    <style>
      .duct{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:2}
      .flow{fill:none;stroke:#111;stroke-width:2.2;marker-end:url(#flowArrow)}
      .node{fill:#fff;stroke:#111;stroke-width:2.5}
      .box{fill:#fff;stroke:#777;stroke-width:1.4;rx:7}
      .title{font:800 29px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;text-anchor:middle}
      .label{font:700 24px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;text-anchor:middle}
      .small{font:600 18px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;text-anchor:middle}
      .length{font:700 18px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;text-anchor:middle;dominant-baseline:middle}
      .note{font:500 16px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#333;text-anchor:middle}
    </style>
  </defs>

  <rect width="1400" height="620" fill="#fff"/>
  <text class="title" x="700" y="42">정압법 덕트 배치도</text>

  <!-- 공기흡입구와 H 구간 -->
  <g>
    <line class="duct" x1="85" y1="205" x2="85" y2="315"/>
    <line class="thin" x1="73" y1="218" x2="97" y2="194"/>
    <line class="thin" x1="73" y1="242" x2="97" y2="218"/>
    <line class="thin" x1="73" y1="266" x2="97" y2="242"/>
    <line class="thin" x1="73" y1="290" x2="97" y2="266"/>
    <line class="thin" x1="73" y1="314" x2="97" y2="290"/>
    <text class="small" x="85" y="178">AIR INTAKE</text>
    <path class="duct" d="M85 205 H180 V475 H250"/>
    <text class="label" x="150" y="195">H</text>
    <text class="small" x="198" y="230">(d)</text>
    <text class="small" x="198" y="457">(c)</text>
    <rect class="box" x="112" y="325" width="58" height="30"/>
    <text class="length" x="141" y="340">5 m</text>
    <rect class="box" x="191" y="491" width="58" height="30"/>
    <text class="length" x="220" y="506">2 m</text>
  </g>

  <!-- 송풍기 -->
  <g>
    <circle class="duct" cx="300" cy="475" r="42"/>
    <path class="duct" d="M300 475 c-23 -8 -20 -29 -5 -37 c20 -10 42 4 43 26 c1 24 -19 45 -46 48"/>
    <path class="duct" d="M342 475 H365 V390"/>
    <text class="small" x="300" y="548">송풍기</text>
    <rect class="box" x="373" y="420" width="58" height="30"/>
    <text class="length" x="402" y="435">5 m</text>
  </g>

  <!-- A-B-C 주덕트 -->
  <path class="duct" d="M365 390 L560 285 V150"/>
  <circle class="node" cx="365" cy="390" r="7"/>
  <circle class="node" cx="560" cy="285" r="7"/>
  <circle class="node" cx="560" cy="150" r="7"/>
  <text class="label" x="345" y="378">A</text>
  <text class="label" x="538" y="312">B</text>
  <text class="label" x="538" y="139">C</text>
  <text class="small" x="390" y="376">(a)</text>
  <text class="small" x="585" y="137">(b)</text>
  <rect class="box" x="433" y="323" width="58" height="30"/>
  <text class="length" x="462" y="338">5 m</text>
  <rect class="box" x="574" y="202" width="66" height="30"/>
  <text class="length" x="607" y="217">20 m</text>

  <!-- 상·하부 주덕트 -->
  <line class="duct" x1="560" y1="150" x2="1260" y2="150"/>
  <line class="duct" x1="560" y1="285" x2="1260" y2="285"/>

  <!-- 취출구 -->
  <g>
    <path class="duct" d="M720 150 V118 H742"/>
    <path class="duct" d="M900 150 V118 H922"/>
    <path class="duct" d="M1080 150 V118 H1102"/>
    <path class="duct" d="M1260 150 V118 H1282"/>
    <path class="duct" d="M720 285 V317 H742"/>
    <path class="duct" d="M900 285 V317 H922"/>
    <path class="duct" d="M1080 285 V317 H1102"/>
    <path class="duct" d="M1260 285 V317 H1282"/>
  </g>
  <g class="thin">
    <line x1="715" y1="126" x2="727" y2="114"/>
    <line x1="895" y1="126" x2="907" y2="114"/>
    <line x1="1075" y1="126" x2="1087" y2="114"/>
    <line x1="1255" y1="126" x2="1267" y2="114"/>
    <line x1="715" y1="309" x2="727" y2="321"/>
    <line x1="895" y1="309" x2="907" y2="321"/>
    <line x1="1075" y1="309" x2="1087" y2="321"/>
    <line x1="1255" y1="309" x2="1267" y2="321"/>
  </g>
  <text class="label" x="720" y="95">D</text>
  <text class="label" x="900" y="95">E</text>
  <text class="label" x="1080" y="95">F</text>
  <text class="label" x="1260" y="95">G</text>
  <text class="label" x="720" y="355">D′</text>
  <text class="label" x="900" y="355">E′</text>
  <text class="label" x="1080" y="355">F′</text>
  <text class="label" x="1260" y="355">G′</text>

  <!-- 상·하부 공통 길이: 한 번만 표시 -->
  <text class="note" x="910" y="382">상·하부 덕트의 대응 구간 길이는 동일</text>
  <g>
    <rect class="box" x="611" y="395" width="58" height="30"/>
    <text class="length" x="640" y="410">6 m</text>
    <rect class="box" x="781" y="395" width="58" height="30"/>
    <text class="length" x="810" y="410">8 m</text>
    <rect class="box" x="961" y="395" width="58" height="30"/>
    <text class="length" x="990" y="410">8 m</text>
    <rect class="box" x="1141" y="395" width="58" height="30"/>
    <text class="length" x="1170" y="410">8 m</text>
  </g>
  <g class="thin">
    <line x1="560" y1="370" x2="560" y2="438"/>
    <line x1="720" y1="370" x2="720" y2="438"/>
    <line x1="900" y1="370" x2="900" y2="438"/>
    <line x1="1080" y1="370" x2="1080" y2="438"/>
    <line x1="1260" y1="370" x2="1260" y2="438"/>
    <line x1="560" y1="438" x2="1260" y2="438"/>
  </g>

  <!-- 흐름방향 -->
  <path class="flow" d="M105 205 H150"/>
  <path class="flow" d="M180 355 V415"/>
  <path class="flow" d="M385 379 L445 347"/>
  <path class="flow" d="M580 150 H635"/>
  <path class="flow" d="M580 285 H635"/>

  <text class="note" x="700" y="585">직선덕트 길이 합계 = 5 + 2 + 5 + 5 + 20 + 6 + 8 + 8 + 8 = 67 m</text>
</svg>
