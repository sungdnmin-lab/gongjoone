<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .wall{stroke:#111;stroke-width:3;fill:none}
      .thin{stroke:#111;stroke-width:1.5;fill:none}
      .dim{stroke:#333;stroke-width:1.2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .txt{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111;font-size:22px}
      .small{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111;font-size:18px}
      .label{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111;font-size:20px;font-weight:600}
    </style>
  </defs>

  <rect width="900" height="620" fill="#fff"/>

  <!-- compass -->
  <g transform="translate(730 55)">
    <line class="thin" x1="0" y1="0" x2="0" y2="82"/>
    <line class="thin" x1="-42" y1="41" x2="42" y2="41"/>
    <path d="M0 0 L-10 18 L0 13 L10 18 Z" fill="#111"/>
    <text class="label" x="-7" y="-10">N</text>
    <text class="label" x="50" y="48">E</text>
    <text class="label" x="-7" y="106">S</text>
    <text class="label" x="-68" y="48">W</text>
  </g>

  <!-- room and neighboring spaces -->
  <rect x="190" y="160" width="480" height="300" class="wall"/>
  <line x1="190" y1="115" x2="670" y2="115" class="thin"/>
  <text class="txt" x="390" y="100">복도</text>
  <line x1="720" y1="160" x2="720" y2="460" class="thin"/>
  <text class="txt" x="745" y="295">인</text>
  <text class="txt" x="745" y="324">접</text>
  <text class="txt" x="745" y="353">실</text>

  <!-- door in north wall, 1.6 x 2.2 m -->
  <line x1="420" y1="160" x2="500" y2="160" stroke="#fff" stroke-width="7"/>
  <line x1="420" y1="160" x2="420" y2="230" class="thin"/>
  <path d="M420 230 A70 70 0 0 1 490 160" class="thin"/>
  <text class="small" x="425" y="142">문 1.6 × 2.2 m</text>

  <!-- west window -->
  <line x1="190" y1="255" x2="190" y2="415" stroke="#fff" stroke-width="8"/>
  <line x1="184" y1="255" x2="196" y2="255" class="thin"/>
  <line x1="184" y1="415" x2="196" y2="415" class="thin"/>
  <line x1="187" y1="255" x2="187" y2="415" class="thin"/>
  <text class="small" x="34" y="323">서측 창</text>
  <text class="small" x="22" y="349">3.2 × 1.4 m</text>

  <!-- south window -->
  <line x1="315" y1="460" x2="555" y2="460" stroke="#fff" stroke-width="8"/>
  <line x1="315" y1="454" x2="315" y2="466" class="thin"/>
  <line x1="555" y1="454" x2="555" y2="466" class="thin"/>
  <line x1="315" y1="463" x2="555" y2="463" class="thin"/>
  <text class="small" x="370" y="495">남측 창 4.5 × 1.4 m</text>

  <!-- room dimensions -->
  <line x1="190" y1="515" x2="190" y2="550" class="thin"/>
  <line x1="670" y1="515" x2="670" y2="550" class="thin"/>
  <line x1="190" y1="540" x2="670" y2="540" class="dim"/>
  <text class="txt" x="418" y="575">9 m</text>

  <line x1="130" y1="160" x2="160" y2="160" class="thin"/>
  <line x1="130" y1="460" x2="160" y2="460" class="thin"/>
  <line x1="145" y1="160" x2="145" y2="460" class="dim"/>
  <text class="txt" x="105" y="320" transform="rotate(-90 105 320)">6 m</text>

  <text class="txt" x="355" y="310">냉방실</text>
  <text class="small" x="330" y="344">천장고 3.8 m</text>
  <text class="small" x="326" y="376">실내 25℃</text>
</svg>
