    <g transform="translate(215 105)"><rect class="s" width="125" height="45"/><rect class="s" x="10" y="10" width="105" height="16"/><text class="t u" x="62.5" y="-10" text-anchor="middle">FCU-2</text><circle class="p" cx="32" cy="45" r="4"/><circle class="p" cx="62.5" cy="45" r="4"/><circle class="p" cx="93" cy="45" r="4"/></g>
    <g transform="translate(380 105)"><rect class="s" width="125" height="45"/><rect class="s" x="10" y="10" width="105" height="16"/><text class="t u" x="62.5" y="-10" text-anchor="middle">FCU-3</text><circle class="p" cx="32" cy="45" r="4"/><circle class="p" cx="62.5" cy="45" r="4"/><circle class="p" cx="93" cy="45" r="4"/></g>
    <g transform="translate(545 105)"><rect class="s" width="125" height="45"/><rect class="s" x="10" y="10" width="105" height="16"/><text class="t u" x="62.5" y="-10" text-anchor="middle">FCU-4</text><circle class="p" cx="32" cy="45" r="4"/><circle class="p" cx="62.5" cy="45" r="4"/><circle class="p" cx="93" cy="45" r="4"/></g>
    <g transform="translate(710 105)"><rect class="s" width="125" height="45"/><rect class="s" x="10" y="10" width="105" height="16"/><text class="t u" x="62.5" y="-10" text-anchor="middle">FCU-5</text><circle class="p" cx="32" cy="45" r="4"/><circle class="p" cx="62.5" cy="45" r="4"/><circle class="p" cx="93" cy="45" r="4"/></g>
    <g transform="translate(875 105)"><rect class="s" width="125" height="45"/><rect class="s" x="10" y="10" width="105" height="16"/><text class="t u" x="62.5" y="-10" text-anchor="middle">FCU-6</text><circle class="p" cx="32" cy="45" r="4"/><circle class="p" cx="62.5" cy="45" r="4"/><circle class="p" cx="93" cy="45" r="4"/></g>
