<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">6번 정압법 덕트 배치도</title>
  <desc id="desc">공기 흡입구, 송풍기, H-A-B-C 주덕트와 D부터 G까지의 상하 분기덕트 및 각 구간 길이를 나타낸 흑백 도면</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .duct{fill:none;stroke:#111;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:2}
      .dim{fill:none;stroke:#111;stroke-width:1.7;marker-start:url(#arrow);marker-end:url(#arrow)}
      .tick{stroke:#111;stroke-width:1.5}
      .label{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:27px;fill:#111}
      .small{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:23px;fill:#111}
      .dimtext{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:22px;font-weight:500;fill:#111}
    </style>
  </defs>

  <!-- 공기 흡입구 -->
  <line class="duct" x1="115" y1="145" x2="115" y2="245"/>
  <line class="tick" x1="105" y1="154" x2="125" y2="134"/>
  <line class="tick" x1="105" y1="176" x2="125" y2="156"/>
  <line class="tick" x1="105" y1="198" x2="125" y2="178"/>
  <line class="tick" x1="105" y1="220" x2="125" y2="200"/>
  <line class="tick" x1="105" y1="242" x2="125" y2="222"/>
  <text class="label" x="70" y="110">AIR INTAKE</text>

  <!-- H에서 송풍기까지 -->
  <path class="duct" d="M115 145 H220 V337 Q220 395 275 395 H315"/>
  <text class="label" x="228" y="155">H</text>
  <text class="small" x="235" y="188">(d)</text>
  <text class="small" x="238" y="377">(c)</text>

  <!-- 송풍기 -->
  <circle class="duct" cx="360" cy="395" r="43"/>
  <path class="duct" d="M360 395 c-24 -8 -22 -31 -5 -39 c21 -10 45 4 46 27 c1 26 -20 48 -49 51"/>
  <line class="duct" x1="403" y1="395" x2="403" y2="307"/>

  <!-- 송풍기에서 A, B, C까지 -->
  <line class="duct" x1="403" y1="307" x2="403" y2="240"/>
  <line class="duct" x1="403" y1="240" x2="545" y2="90"/>
  <text class="label" x="375" y="246">A</text>
  <text class="label" x="476" y="181">B</text>
  <text class="label" x="552" y="104">C</text>
  <text class="small" x="426" y="259">(a)</text>
  <text class="small" x="553" y="67">(b)</text>

  <!-- 상부와 하부 주덕트 -->
  <line class="duct" x1="545" y1="90" x2="1235" y2="90"/>
  <line class="duct" x1="475" y1="205" x2="1235" y2="205"/>

  <!-- 상부 취출구 D-E-F-G -->
  <g class="duct">
    <path d="M650 90 v24 h17"/>
    <path d="M835 90 v24 h17"/>
    <path d="M1020 90 v24 h17"/>
    <path d="M1205 90 v24 h17"/>
  </g>
  <g class="thin">
    <line x1="645" y1="106" x2="657" y2="94"/>
    <line x1="830" y1="106" x2="842" y2="94"/>
    <line x1="1015" y1="106" x2="1027" y2="94"/>
    <line x1="1200" y1="106" x2="1212" y2="94"/>
  </g>
  <text class="label" x="648" y="65">D</text>
  <text class="label" x="833" y="65">E</text>
  <text class="label" x="1018" y="65">F</text>
  <text class="label" x="1203" y="65">G</text>

  <!-- 하부 취출구 D' - E' - F' - G' -->
  <g class="duct">
    <path d="M650 205 v-24 h17"/>
    <path d="M835 205 v-24 h17"/>
    <path d="M1020 205 v-24 h17"/>
    <path d="M1205 205 v-24 h17"/>
  </g>
  <g class="thin">
    <line x1="645" y1="189" x2="657" y2="177"/>
    <line x1="830" y1="189" x2="842" y2="177"/>
    <line x1="1015" y1="189" x2="1027" y2="177"/>
    <line x1="1200" y1="189" x2="1212" y2="177"/>
  </g>
  <text class="label" x="671" y="190">D′</text>
  <text class="label" x="856" y="190">E′</text>
  <text class="label" x="1041" y="190">F′</text>
  <text class="label" x="1226" y="190">G′</text>

  <!-- 세로 치수 5 m -->
  <line class="thin" x1="360" y1="240" x2="390" y2="240"/>
  <line class="thin" x1="360" y1="307" x2="390" y2="307"/>
  <line class="dim" x1="372" y1="244" x2="372" y2="303"/>
  <text class="dimtext" x="345" y="288" transform="rotate(-90 345 288)">5 m</text>

  <!-- H 구간 세로 치수 5 m -->
  <line class="thin" x1="145" y1="145" x2="195" y2="145"/>
  <line class="thin" x1="145" y1="337" x2="195" y2="337"/>
  <line class="dim" x1="160" y1="151" x2="160" y2="331"/>
  <text class="dimtext" x="145" y="262" transform="rotate(-90 145 262)">5 m</text>

  <!-- 송풍기 전 수평 치수 2 m -->
  <line class="thin" x1="220" y1="416" x2="220" y2="445"/>
  <line class="thin" x1="315" y1="416" x2="315" y2="445"/>
  <line class="dim" x1="226" y1="432" x2="309" y2="432"/>
  <text class="dimtext" x="252" y="463">2 m</text>

  <!-- 사선 구간 5 m와 20 m -->
  <line class="thin" x1="403" y1="226" x2="383" y2="207"/>
  <line class="thin" x1="475" y1="191" x2="455" y2="172"/>
  <line class="dim" x1="393" y1="213" x2="458" y2="145"/>
  <text class="dimtext" x="396" y="171" transform="rotate(-46 396 171)">5 m</text>

  <line class="thin" x1="475" y1="191" x2="455" y2="172"/>
  <line class="thin" x1="545" y1="76" x2="525" y2="57"/>
  <line class="dim" x1="467" y1="175" x2="529" y2="108"/>
  <text class="dimtext" x="472" y="132" transform="rotate(-46 472 132)">20 m</text>

  <!-- 하부 주덕트 치수 6 m, 8 m, 8 m, 8 m -->
  <g class="thin">
    <line x1="475" y1="220" x2="475" y2="252"/>
    <line x1="650" y1="220" x2="650" y2="252"/>
    <line x1="835" y1="220" x2="835" y2="252"/>
    <line x1="1020" y1="220" x2="1020" y2="252"/>
    <line x1="1205" y1="220" x2="1205" y2="252"/>
  </g>
  <g class="dim">
    <line x1="482" y1="240" x2="643" y2="240"/>
    <line x1="657" y1="240" x2="828" y2="240"/>
    <line x1="842" y1="240" x2="1013" y2="240"/>
    <line x1="1027" y1="240" x2="1198" y2="240"/>
  </g>
  <text class="dimtext" x="550" y="273">6 m</text>
  <text class="dimtext" x="736" y="273">8 m</text>
  <text class="dimtext" x="921" y="273">8 m</text>
  <text class="dimtext" x="1106" y="273">8 m</text>
</svg>
