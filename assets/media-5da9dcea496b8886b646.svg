<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .pipe{fill:none;stroke:#111;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .equip{fill:#fff;stroke:#111;stroke-width:2.3}
      .thin{fill:none;stroke:#111;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .txt{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#111;font-size:19px}
      .small{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#111;font-size:16px}
      .tag{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#111;font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .head{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#111;font-size:15px;font-weight:700}
    </style>
    <g id="valveV"><path d="M-8-9 L0 0 L8-9 Z M-8 9 L0 0 L8 9 Z" class="equip"/></g>
    <g id="valveH"><path d="M-9-8 L0 0 L-9 8 Z M9-8 L0 0 L9 8 Z" class="equip"/></g>
    <g id="arrow"><path d="M-8-5 L0 0 L-8 5" class="thin"/></g>
  </defs>

  <rect x="1" y="1" width="958" height="518" fill="#fff"/>
  <text x="34" y="40" class="txt" font-weight="700">핫가스 제상 배관 완성도</text>

  <!-- completed headers -->
  <path d="M63 397 V84 H849 V127" class="pipe"/>
  <path d="M602 127 V84 M849 127 V84" class="pipe"/>
  <text x="678" y="75" class="head">흡입관</text>
  <path d="M137 176 V126 H749 V127" class="pipe"/>
  <path d="M502 127 V126 M749 127 V126" class="pipe"/>
  <text x="648" y="117" class="head">핫가스관</text>
  <path d="M438 401 V456 H799 V408" class="pipe"/>
  <path d="M519 440 V456 M585 440 V456" class="pipe"/>
  <text x="677" y="482" class="head">액관</text>

  <!-- compressor -->
  <circle cx="105" cy="397" r="42" class="equip"/>
  <path d="M78 407 Q105 370 132 407" class="thin"/>
  <path d="M82 391 Q105 420 128 391" class="thin"/>
  <text x="105" y="463" class="txt" text-anchor="middle">압축기</text>
  <path d="M105 355 L105 319" class="pipe"/>
  <use href="#arrow" x="105" y="336" transform="rotate(-90 105 336)"/>

  <!-- oil separator -->
  <rect x="84" y="213" width="42" height="106" rx="18" class="equip"/>
  <path d="M93 231 Q105 247 117 231" class="thin"/>
  <path d="M93 300 Q105 284 117 300" class="thin"/>
  <text x="105" y="270" class="small" text-anchor="middle" transform="rotate(-90 105 270)">유분리기</text>
  <path d="M105 213 L105 176 L178 176 L178 250" class="pipe"/>

  <!-- condenser -->
  <rect x="178" y="239" width="126" height="96" class="equip"/>
  <path d="M195 258 H287 M195 277 H287 M195 296 H287 M195 315 H287" class="thin"/>
  <path d="M203 248 V326 M223 248 V326 M243 248 V326 M263 248 V326 M283 248 V326" class="thin"/>
  <text x="241" y="230" class="txt" text-anchor="middle">응축기</text>
  <path d="M304 315 H330 V376" class="pipe"/>

  <!-- receiver -->
  <rect x="252" y="376" width="134" height="50" rx="25" class="equip"/>
  <path d="M270 401 H368" class="thin"/>
  <text x="319" y="408" class="txt" text-anchor="middle">수액기</text>
  <path d="M386 401 H414" class="pipe"/>
  <use href="#valveH" x="400" y="401"/>
  <circle cx="400" cy="365" r="14" class="equip"/>
  <text x="400" y="365" class="tag">B</text>
  <path d="M414 401 H438" class="pipe"/>

  <!-- coil A -->
  <text x="547" y="107" class="txt" font-weight="700" text-anchor="middle">냉각코일 A</text>
  <path d="M502 226 V315 Q502 339 519 339 Q536 339 536 315 V226 Q536 207 552 207 Q568 207 568 226 V315 Q568 339 585 339 Q602 339 602 315 V226" class="pipe"/>
  <path d="M502 226 V182" class="pipe"/>
  <use href="#valveV" x="502" y="166"/>
  <path d="M502 150 V126" class="pipe"/>
  <circle cx="470" cy="166" r="14" class="equip"/>
  <text x="470" y="166" class="tag">D</text>
  <path d="M602 226 V182" class="pipe"/>
  <use href="#valveV" x="602" y="166"/>
  <path d="M602 150 V84" class="pipe"/>
  <circle cx="634" cy="166" r="14" class="equip"/>
  <text x="634" y="166" class="tag">C</text>
  <path d="M519 339 V376" class="pipe"/>
  <use href="#valveV" x="519" y="392"/>
  <path d="M519 408 V456" class="pipe"/>
  <circle cx="487" cy="392" r="14" class="equip"/>
  <text x="487" y="392" class="tag">A</text>
  <text x="471" y="430" class="small" text-anchor="middle">팽창밸브</text>
  <path d="M585 339 V376" class="pipe"/>
  <use href="#valveV" x="585" y="392"/>
  <path d="M585 408 V456" class="pipe"/>
  <circle cx="617" cy="392" r="14" class="equip"/>
  <text x="617" y="392" class="tag">E</text>

  <!-- coil B -->
  <text x="794" y="107" class="txt" font-weight="700" text-anchor="middle">냉각코일 B</text>
  <path d="M749 226 V315 Q749 339 766 339 Q783 339 783 315 V226 Q783 207 799 207 Q815 207 815 226 V315 Q815 339 832 339 Q849 339 849 315 V226" class="pipe"/>
  <path d="M749 226 V182" class="pipe"/>
  <use href="#valveV" x="749" y="166"/>
  <path d="M749 150 V126" class="pipe"/>
  <circle cx="717" cy="166" r="14" class="equip"/>
  <text x="717" y="166" class="tag">H</text>
  <path d="M849 226 V182" class="pipe"/>
  <use href="#valveV" x="849" y="166"/>
  <path d="M849 150 V84" class="pipe"/>
  <circle cx="881" cy="166" r="14" class="equip"/>
  <text x="881" y="166" class="tag">G</text>
  <path d="M799 339 V376" class="pipe"/>
  <use href="#valveV" x="799" y="392"/>
  <path d="M799 408 V456" class="pipe"/>
  <circle cx="767" cy="392" r="14" class="equip"/>
  <text x="767" y="392" class="tag">F</text>
  <text x="751" y="430" class="small" text-anchor="middle">팽창밸브</text>

  <text x="48" y="505" class="small">※ A~H는 밸브 기호이다.</text>
</svg>
