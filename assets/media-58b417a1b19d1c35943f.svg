<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#fff"/>
  <style>
    text { font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; fill: #111; }
    .line { stroke: #111; stroke-width: 2; fill: none; }
    .thin { stroke: #111; stroke-width: 1.3; fill: none; }
    .label { font-size: 22px; }
    .small { font-size: 19px; }
    .head { font-size: 20px; font-weight: 700; }
    .cell { font-size: 19px; }
  </style>

  <!-- 냉장실 평면도 -->
  <line class="line" x1="160" y1="90" x2="840" y2="90"/>
  <line class="line" x1="300" y1="90" x2="300" y2="300"/>
  <line class="line" x1="700" y1="90" x2="700" y2="300"/>
  <line class="line" x1="160" y1="300" x2="840" y2="300"/>

  <text class="label" x="165" y="58">외기 33℃</text>
  <text class="label" x="205" y="194" text-anchor="middle">인접실</text>
  <text class="label" x="205" y="225" text-anchor="middle">2℃</text>
  <text class="label" x="465" y="190">냉장실</text>
  <text class="label" x="492" y="222">2℃</text>
  <text class="label" x="745" y="194">인접실</text>
  <text class="label" x="768" y="225">2℃</text>
  <text class="label" x="465" y="337">복도 9℃</text>

  <!-- 가로 치수 18 m -->
  <line class="thin" x1="300" y1="54" x2="700" y2="54"/>
  <line class="thin" x1="300" y1="42" x2="300" y2="66"/>
  <line class="thin" x1="700" y1="42" x2="700" y2="66"/>
  <text class="small" x="478" y="45">18 m</text>

  <!-- 세로 치수 12 m: 냉장실 내부에 표시 -->
  <line class="thin" x1="660" y1="100" x2="660" y2="290"/>
  <line class="thin" x1="648" y1="100" x2="672" y2="100"/>
  <line class="thin" x1="648" y1="290" x2="672" y2="290"/>
  <text class="small" x="638" y="218" transform="rotate(-90 638 218)">12 m</text>

  <!-- 바닥재 표 -->
  <rect class="line" x="175" y="395" width="650" height="190"/>
  <line class="thin" x1="175" y1="440" x2="825" y2="440"/>
  <line class="thin" x1="175" y1="469" x2="825" y2="469"/>
  <line class="thin" x1="175" y1="498" x2="825" y2="498"/>
  <line class="thin" x1="175" y1="527" x2="825" y2="527"/>
  <line class="thin" x1="175" y1="556" x2="825" y2="556"/>
  <line class="thin" x1="365" y1="395" x2="365" y2="585"/>
  <line class="thin" x1="555" y1="395" x2="555" y2="585"/>

  <text class="head" x="226" y="425">바닥재 층</text>
  <text class="head" x="414" y="425">두께 [mm]</text>
  <text class="head" x="623" y="416">열전도율</text>
  <text class="small" x="620" y="436">[W/(m·K)]</text>

  <text class="cell" x="264" y="462">P</text>
  <text class="cell" x="448" y="462">120</text>
  <text class="cell" x="663" y="462">0.35</text>
  <text class="cell" x="264" y="491">Q</text>
  <text class="cell" x="448" y="491">180</text>
  <text class="cell" x="663" y="491">0.55</text>
  <text class="cell" x="264" y="520">R</text>
  <text class="cell" x="448" y="520">250</text>
  <text class="cell" x="670" y="520">1.4</text>
  <text class="cell" x="264" y="549">S</text>
  <text class="cell" x="448" y="549">380</text>
  <text class="cell" x="670" y="549">0.9</text>
  <text class="cell" x="264" y="578">T</text>
  <text class="cell" x="448" y="578">420</text>
  <text class="cell" x="670" y="578">0.7</text>
</svg>
